name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions: contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
        working-directory: packages/delegator
      - run: npm test
        working-directory: packages/delegator
      - run: python3 packages/verifier/factory-verifier.test.py
      - run: node --test packages/verifier/autopilot.test.mjs
