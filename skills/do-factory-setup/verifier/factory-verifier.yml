name: factory-verifier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-verifier-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python {0}
        run: |
          import json
          import os
          import subprocess

          args = ["scripts/factory-verifier", "plan"]
          if os.environ["EVENT_NAME"] == "pull_request":
              args += ["--base", os.environ["BASE_SHA"], "--head", os.environ["HEAD_SHA"]]
          else:
              args += ["--all"]
          plan = json.loads(subprocess.check_output(args, text=True))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("checks=" + json.dumps(plan["checks"], separators=(",", ":")) + "\n")

  checks:
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up repo tools
        if: hashFiles('.github/actions/factory-verifier-setup/**') != ''
        uses: ./.github/actions/factory-verifier-setup
      - name: Run check
        env:
          CHECK: ${{ matrix.check }}
        run: scripts/factory-verifier run "$CHECK"

  verifier:
    name: verifier
    needs: [plan, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          PASSED: ${{ needs.plan.result == 'success' && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.plan.outputs.checks == '[]')) }}
        run: test "$PASSED" = true

  report:
    needs: [plan, checks]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Collect failed checks
        id: failures
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref: context.sha, per_page: 100
            });
            const plan = JSON.parse(require('node:child_process').execFileSync(
              'scripts/factory-verifier', ['plan', '--all'], {encoding: 'utf8'}));
            const prefix = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/`;
            const failed = runs.filter(run =>
              run.app?.slug === 'github-actions' && run.details_url?.startsWith(prefix) &&
              plan.checks.includes(run.name) && ['failure', 'timed_out'].includes(run.conclusion));
            core.setOutput('checks', [...new Set(failed.map(run => run.name))].join(','));
      - name: Report failures to Linear
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FAILED_CHECKS: ${{ steps.failures.outputs.checks }}
          FACTORY_LINEAR_CLIENT_ID: ${{ secrets.FACTORY_LINEAR_CLIENT_ID }}
          FACTORY_LINEAR_CLIENT_SECRET: ${{ secrets.FACTORY_LINEAR_CLIENT_SECRET }}
          FACTORY_VERIFIER_LINEAR_TEAM: ${{ vars.FACTORY_VERIFIER_LINEAR_TEAM }}
          FACTORY_VERIFIER_PRODUCT_LABEL: ${{ vars.FACTORY_VERIFIER_PRODUCT_LABEL }}
          FACTORY_VERIFIER_REPO: ${{ vars.FACTORY_VERIFIER_REPO }}
        run: scripts/factory-verifier report --before "$BEFORE_SHA" --after "$AFTER_SHA" --failed "$FAILED_CHECKS"
