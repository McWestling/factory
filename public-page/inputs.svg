<svg xmlns="http://www.w3.org/2000/svg" class="fd" viewBox="0 0 400 200" role="img" aria-label="Where ideas come from: a loose heap of five things. A handwritten sticky note that says remind people before the dinner, a voice note, a task typed into the tracker that says RSVP count is wrong, a chat message that asks could guests bring a plus one, and an email." stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
<style>.fd{--paper:#f7f2e8;--ink:#17130f;--acc:#8f8372;--on:#17130f;color:var(--ink)}
@media(prefers-color-scheme:dark){.fd{--paper:#171716;--ink:#eee6d6;--acc:#a99f8e}}
.fd text{fill:var(--ink);font-family:Georgia,"Times New Roman",serif;stroke:none}
.fd .n{fill:none}.fd .p{fill:var(--paper)}.fd .i{fill:var(--ink)}.fd .a{fill:var(--acc)}.fd text.on{fill:var(--on)}.fd .s-on{stroke:var(--on)}
.fd .hum{stroke:#e0632a}.fd .hum-t{fill:#e0632a}
.fd .lamp{fill:#e0632a;animation:fd-lamp 2s steps(1,end) infinite}
.fd .rays{stroke:#e0632a;animation:fd-rays 2s steps(1,end) infinite}
@keyframes fd-lamp{0%{fill-opacity:1}50%{fill-opacity:.12}}
@keyframes fd-rays{0%{opacity:1}50%{opacity:0}}
.fd .bub{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:fd-bub 12s ease-in-out infinite}
@keyframes fd-bub{0%{opacity:0;transform:translateY(4px) scale(.6)}8%,24%{opacity:1;transform:none}31%,100%{opacity:0;transform:translateY(-4px) scale(.8)}}</style>
<defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/></pattern></defs>
<rect class="p" width="400" height="200" stroke="none"/>
<g transform="translate(128 158) rotate(-12)"><rect class="p" x="-32" y="-44" width="64" height="44"/><polyline class="n" points="-32,-44 0,-18.5 32,-44"/></g>
<g transform="translate(182 120) rotate(-7)"><rect class="p" x="-35" y="-58" width="70" height="58"/><line x1="-35" y1="-40" x2="35" y2="-40"/><circle class="p" cx="26" cy="-49" r="3"/><text x="-30" y="-46" font-size="7" font-weight="bold">New</text><text x="-30" y="-28" font-size="7">RSVP count</text><text x="-30" y="-17" font-size="7">is wrong</text></g>
<g transform="translate(236 92) rotate(10)"><rect class="p" x="-32" y="-28" width="64" height="28" rx="14"/><circle class="i" cx="-18" cy="-14" r="5.6" stroke="none"/><line x1="-4" y1="-18.2" x2="-4" y2="-9.8"/><line x1="-0.9" y1="-21.6" x2="-0.9" y2="-6.4"/><line x1="2.3" y1="-16.9" x2="2.3" y2="-11.1"/><line x1="5.4" y1="-19.9" x2="5.4" y2="-8.1"/><line x1="8.6" y1="-22.4" x2="8.6" y2="-5.6"/><line x1="11.7" y1="-17.8" x2="11.7" y2="-10.2"/><line x1="14.9" y1="-20.7" x2="14.9" y2="-7.3"/><line x1="18" y1="-16.5" x2="18" y2="-11.5"/></g>
<g transform="translate(268 150) rotate(8)"><path class="p" d="M-30,-52 H30 Q34,-52 34,-48 V-15.4 Q34,-11.4 30,-11.4 H-10.9 L-23.1,0 L-21.8,-11.4 H-30 Q-34,-11.4 -34,-15.4 V-48 Q-34,-52 -30,-52 Z"/><text x="-29" y="-36" font-size="7">Could guests</text><text x="-29" y="-25" font-size="7">bring a +1?</text></g>
<g transform="translate(200 162) rotate(4)"><g transform="translate(-56 -240)"><rect class="a" x="30" y="188" width="52" height="52"/><text x="35" y="205" font-size="7" class="on" font-style="italic">remind</text><text x="35" y="216" font-size="7" class="on" font-style="italic">people before</text><text x="35" y="227" font-size="7" class="on" font-style="italic">the dinner!!</text></g></g>
<circle class="i" cx="207" cy="154" r="2.5" stroke="none"/><line x1="207" y1="154" x2="240" y2="184" stroke-width="0.8"/><circle class="p" cx="240" cy="184" r="9" stroke-width="0.8"/><text x="240" y="187.5" font-size="10.5" text-anchor="middle">1</text><circle class="i" cx="252" cy="72" r="2.5" stroke="none"/><line x1="252" y1="72" x2="288" y2="46" stroke-width="0.8"/><circle class="p" cx="288" cy="46" r="9" stroke-width="0.8"/><text x="288" y="49.5" font-size="10.5" text-anchor="middle">2</text><circle class="i" cx="166" cy="72" r="2.5" stroke="none"/><line x1="166" y1="72" x2="130" y2="44" stroke-width="0.8"/><circle class="p" cx="130" cy="44" r="9" stroke-width="0.8"/><text x="130" y="47.5" font-size="10.5" text-anchor="middle">3</text><circle class="i" cx="292" cy="124" r="2.5" stroke="none"/><line x1="292" y1="124" x2="330" y2="148" stroke-width="0.8"/><circle class="p" cx="330" cy="148" r="9" stroke-width="0.8"/><text x="330" y="151.5" font-size="10.5" text-anchor="middle">4</text><circle class="i" cx="108" cy="142" r="2.5" stroke="none"/><line x1="108" y1="142" x2="72" y2="168" stroke-width="0.8"/><circle class="p" cx="72" cy="168" r="9" stroke-width="0.8"/><text x="72" y="171.5" font-size="10.5" text-anchor="middle">5</text>
</svg>
