<circle class="n" cx="100" cy="84" r="27"/><g class="n" transform="translate(100 86) scale(2.6)" stroke-width="0.3"><path d="M-5,-2 H5 V2 Q5,5 2,5 H-2 Q-5,5 -5,2 Z M-5,0 H-7 M5,0 H7 M-6,-2 H6 M-4,-2 Q0,-6.5 4,-2"/></g><path class="n" d="M94,68 q-2.5,-3 0,-6 M100,68 q-2.5,-3 0,-6 M106,68 q-2.5,-3 0,-6" stroke-width="1"/>
