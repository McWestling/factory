<svg xmlns="http://www.w3.org/2000/svg" class="fd" viewBox="0 0 824 250" role="img" aria-label="What Factory is made of: a task in Linear goes to Delegator, which starts coding agents in Orca. The agents follow Factory's skills. Verifier runs the checks, and the change goes up to GitHub as a pull request. A person under a lit orange lamp reviews and merges it, and the result goes back to Linear. Factory's own parts, Skills, Delegator and Verifier, are filled brown." stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
<style>.fd{--paper:#f7f2e8;--ink:#17130f;--acc:#8f8372;--on:#17130f;color:var(--ink)}
@media(prefers-color-scheme:dark){.fd{--paper:#171716;--ink:#eee6d6;--acc:#a99f8e}}
.fd text{fill:var(--ink);font-family:Georgia,"Times New Roman",serif;stroke:none}
.fd .n{fill:none}.fd .p{fill:var(--paper)}.fd .i{fill:var(--ink)}.fd .a{fill:var(--acc)}.fd text.on{fill:var(--on)}.fd .s-on{stroke:var(--on)}
.fd .hum{stroke:#e0632a}.fd .hum-t{fill:#e0632a}
.fd .lamp{fill:#e0632a;animation:fd-lamp 2s steps(1,end) infinite}
.fd .rays{stroke:#e0632a;animation:fd-rays 2s steps(1,end) infinite}
@keyframes fd-lamp{0%{fill-opacity:1}50%{fill-opacity:.12}}
@keyframes fd-rays{0%{opacity:1}50%{opacity:0}}
.fd .bub{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:fd-bub 12s ease-in-out infinite}
@keyframes fd-bub{0%{opacity:0;transform:translateY(4px) scale(.6)}8%,24%{opacity:1;transform:none}31%,100%{opacity:0;transform:translateY(-4px) scale(.8)}}</style>
<defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/></pattern></defs>
<rect class="p" width="824" height="250" stroke="none"/>
<rect fill="url(#hatch)" x="48" y="104" width="104" height="44"/><rect class="p" x="40" y="110" width="104" height="44"/><text x="92" y="129" font-size="13" font-weight="bold" text-anchor="middle">Linear</text><text x="92" y="144" font-size="10" text-anchor="middle">holds the tasks</text><rect fill="url(#hatch)" x="208" y="104" width="104" height="44"/><rect class="a" x="200" y="110" width="104" height="44"/><text class="on" x="252" y="129" font-size="13" font-weight="bold" text-anchor="middle">Delegator</text><text class="on" x="252" y="144" font-size="10" text-anchor="middle">starts the work</text><rect fill="url(#hatch)" x="368" y="104" width="104" height="44"/><rect class="p" x="360" y="110" width="104" height="44"/><text x="412" y="129" font-size="13" font-weight="bold" text-anchor="middle">Orca</text><text x="412" y="144" font-size="10" text-anchor="middle">agents at work</text><rect fill="url(#hatch)" x="528" y="104" width="104" height="44"/><rect class="a" x="520" y="110" width="104" height="44"/><text class="on" x="572" y="129" font-size="13" font-weight="bold" text-anchor="middle">Verifier</text><text class="on" x="572" y="144" font-size="10" text-anchor="middle">runs the checks</text><rect fill="url(#hatch)" x="688" y="104" width="104" height="44"/><rect class="p" x="680" y="110" width="104" height="44"/><text x="732" y="129" font-size="13" font-weight="bold" text-anchor="middle">GitHub</text><text x="732" y="144" font-size="10" text-anchor="middle">pull request</text>
<path class="n" d="M152,132 H200"/><polygon class="i" points="200,132 191,127.5 191,136.5" stroke="none"/><path class="n" d="M312,132 H360"/><polygon class="i" points="360,132 351,127.5 351,136.5" stroke="none"/><path class="n" d="M472,132 H520"/><polygon class="i" points="520,132 511,127.5 511,136.5" stroke="none"/><path class="n" d="M632,132 H680"/><polygon class="i" points="680,132 671,127.5 671,136.5" stroke="none"/>
<rect fill="url(#hatch)" x="368" y="18" width="104" height="44"/><rect class="a" x="360" y="24" width="104" height="44"/><text class="on" x="412" y="43" font-size="13" font-weight="bold" text-anchor="middle">Skills</text><text class="on" x="412" y="58" font-size="10" text-anchor="middle">the instructions</text><path class="n" d="M412,68 V110"/><polygon class="i" points="412,110 407.5,101 416.5,101" stroke="none"/>
<path class="n" d="M732,154 V228 H92 V154"/><polygon class="i" points="92,154 87.5,163 96.5,163" stroke="none"/>
<path class="p" d="M398,228 L403,194 H421 L426,228 Z"/><circle class="p" cx="412" cy="182" r="9"/><g transform="translate(442 228)"><line x1="0" y1="-20" x2="0" y2="-31"/><circle class="lamp" cx="0" cy="-36" r="4.5"/><g class="n rays"><line x1="0" y1="-45" x2="0" y2="-50"/><line x1="-8" y1="-42" x2="-12" y2="-46"/><line x1="8" y1="-42" x2="12" y2="-46"/></g></g><text x="462" y="218" font-size="10">You decide, review and merge</text>
</svg>
