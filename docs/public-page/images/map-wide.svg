<svg xmlns="http://www.w3.org/2000/svg" class="fd" viewBox="0 0 824 250" role="img" aria-label="What the Factory is made of: a task in Linear goes to Delegator, which starts coding agents in Orca. The agents follow the Factory's skills. Verifier runs the checks, and the change goes up to GitHub as a pull request. A human under a lit orange lamp reviews and merges it, and the result goes back to Linear. The Factory's own parts, Skills, Delegator and Verifier, are filled brown." stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
<style>.fd{--ink:#17130f;--acc:#8f8372;--on:#17130f;color:var(--ink)}
@media(prefers-color-scheme:dark){.fd{--ink:#eee6d6;--acc:#a99f8e}}
.fd text{fill:var(--ink);font-family:Georgia,"Times New Roman",serif;stroke:none}
.fd text.hand{font-family:"Bradley Hand","Segoe Print","Chalkboard SE","Comic Sans MS",cursive}
.fd text.num{font:bold 13px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.fd .n{fill:none}.fd .k{fill:none}.fd .i{fill:var(--ink)}.fd .a{fill:var(--acc)}.fd text.on{fill:var(--on)}.fd .s-on{stroke:var(--on)}
.fd .hum{stroke:#e0632a}.fd .hum-t{fill:#e0632a}
.fd .lamp{fill:#e0632a;animation:fd-lamp 2s steps(1,end) infinite}
.fd .rays{stroke:#e0632a;animation:fd-rays 2s steps(1,end) infinite}
@keyframes fd-lamp{0%{fill-opacity:1}50%{fill-opacity:.12}}
@keyframes fd-rays{0%{opacity:1}50%{opacity:0}}
.fd .bub{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:fd-bub 12s ease-in-out infinite}
@keyframes fd-bub{0%{opacity:0;transform:translateY(4px) scale(.6)}8%,24%{opacity:1;transform:none}31%,100%{opacity:0;transform:translateY(-4px) scale(.8)}}</style>
<defs><mask id="k2-0" maskUnits="userSpaceOnUse" x="0" y="0" width="824" height="250"><rect width="824" height="250" fill="#fff" stroke="none"/><rect fill="#000" stroke="none" x="40" y="110" width="104" height="44"/></mask><mask id="k2-1" maskUnits="userSpaceOnUse" x="0" y="0" width="824" height="250"><rect width="824" height="250" fill="#fff" stroke="none"/><rect fill="#000" stroke="none" x="360" y="110" width="104" height="44"/></mask><mask id="k2-2" maskUnits="userSpaceOnUse" x="0" y="0" width="824" height="250"><rect width="824" height="250" fill="#fff" stroke="none"/><rect fill="#000" stroke="none" x="680" y="110" width="104" height="44"/></mask></defs><g mask="url(#k2-2)"><g mask="url(#k2-1)"><g mask="url(#k2-0)"><rect class="a" stroke="none" x="48" y="104" width="104" height="44"/></g><rect class="k" x="40" y="110" width="104" height="44"/><text x="92" y="129" font-size="13" font-weight="bold" text-anchor="middle">Linear</text><text x="92" y="144" font-size="10" text-anchor="middle">holds the tasks</text><rect class="a" stroke="none" x="208" y="104" width="104" height="44"/><rect class="a" x="200" y="110" width="104" height="44"/><text class="on" x="252" y="129" font-size="13" font-weight="bold" text-anchor="middle">Delegator</text><text class="on" x="252" y="144" font-size="10" text-anchor="middle">starts the work</text><rect class="a" stroke="none" x="368" y="104" width="104" height="44"/></g><rect class="k" x="360" y="110" width="104" height="44"/><text x="412" y="129" font-size="13" font-weight="bold" text-anchor="middle">Orca</text><text x="412" y="144" font-size="10" text-anchor="middle">agents at work</text><rect class="a" stroke="none" x="528" y="104" width="104" height="44"/><rect class="a" x="520" y="110" width="104" height="44"/><text class="on" x="572" y="129" font-size="13" font-weight="bold" text-anchor="middle">Verifier</text><text class="on" x="572" y="144" font-size="10" text-anchor="middle">runs the checks</text><rect class="a" stroke="none" x="688" y="104" width="104" height="44"/></g><rect class="k" x="680" y="110" width="104" height="44"/><text x="732" y="129" font-size="13" font-weight="bold" text-anchor="middle">GitHub</text><text x="732" y="144" font-size="10" text-anchor="middle">pull request</text>
<path class="n" d="M152,132 H200"/><polygon class="i" points="200,132 191,127.5 191,136.5" stroke="none"/><path class="n" d="M312,132 H360"/><polygon class="i" points="360,132 351,127.5 351,136.5" stroke="none"/><path class="n" d="M472,132 H520"/><polygon class="i" points="520,132 511,127.5 511,136.5" stroke="none"/><path class="n" d="M632,132 H680"/><polygon class="i" points="680,132 671,127.5 671,136.5" stroke="none"/>
